<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAFTAR BOT FUTURES</title>
<style>
  body{margin:0;background:#080a0f;color:#e5e7eb;font-family:Inter,system-ui,sans-serif;padding:14px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:16px;margin-bottom:12px}
  .tabs{display:flex;gap:8px;margin:10px 0}
  .tab{flex:1;padding:11px;border-radius:10px;border:1px solid #1f2937;background:#020617;color:#9ca3af;text-align:center;font-weight:800;cursor:pointer}
  .tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
  input{width:100%;padding:13px;background:#020617;border:1px solid #1f2937;color:#fff;border-radius:10px;margin:6px 0;box-sizing:border-box}
  .btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#3b82f6;color:#fff}
  .muted{font-size:12px;color:#9ca3af;text-align:center}
  .hidden{display:none}
  .logo{text-align:center;font-size:26px;font-weight:900;margin:10px 0}
</style>
</head>
<body>
<div style="max-width:420px;margin:20px auto">
<div class="logo">🚀 DAFTAR BOT FUTURES</div>
<p class="muted">Pilih metode OTP yang kamu punya</p>

<div class="card" id="formBox">
  <input id="nama" placeholder="Nama Lengkap">
  <div class="tabs">
    <div id="tabWa" class="tab active" onclick="setM('wa')">📱 No WA</div>
    <div id="tabEmail" class="tab" onclick="setM('email')">📧 Email</div>
  </div>
  <div id="inWa"><input id="wa" placeholder="No WA 089660276661"></div>
  <div id="inEmail" class="hidden"><input id="email" placeholder="Email kamu"></div>
  <button class="btn" onclick="daftar()">DAFTAR & KIRIM OTP</button>
  <div id="msg" class="muted" style="margin-top:8px"></div>
</div>

<div class="card hidden" id="otpBox">
  <div style="text-align:center"><b id="otpTitle">Kode OTP</b><br><span class="muted" id="otpInfo"></span></div>
  <input id="otpInput" placeholder="6 digit OTP" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:6px">
  <button class="btn" onclick="verif()">VERIFIKASI OTP</button>
  <div id="otpMsg" style="text-align:center;margin-top:10px"></div>
</div>

<div class="card hidden" id="doneBox" style="text-align:center">
  <h3>✅ BERHASIL DAFTAR</h3>
  <p class="muted">Akun kamu sudah jadi. Hubungi admin untuk aktifkan gas.</p>
  <div style="background:#020617;padding:10px;border-radius:10px;font-size:13px">ID KAMU: <b id="myId" style="color:#22c55e"></b></div>
  <a href="dashboard.html"><button class="btn" style="margin-top:10px">MASUK DASHBOARD</button></a>
</div>
</div>

<script>
const FB="https://mrdien-scalper-default-rtdb.firebaseio.com";
let method='wa',temp={},genOtp="";
function setM(m){method=m;document.getElementById('tabWa').classList.toggle('active',m=='wa');document.getElementById('tabEmail').classList.toggle('active',m=='email');document.getElementById('inWa').classList.toggle('hidden',m!='wa');document.getElementById('inEmail').classList.toggle('hidden',m!='email');}
function genId(){return "CLIENT_"+Math.floor(100+Math.random()*900)}
function genOtpC(){return Math.floor(100000+Math.random()*900000).toString()}
async function daftar(){
  let nama=document.getElementById('nama').value.trim();
  let wa=document.getElementById('wa').value.trim().replace(/[^0-9]/g,'');
  let email=document.getElementById('email').value.trim();
  if(!nama){document.getElementById('msg').innerText='Isi nama dulu';return}
  if(method=='wa'&&!wa){document.getElementById('msg').innerText='Isi No WA';return}
  if(method=='email'&&!email){document.getElementById('msg').innerText='Isi Email';return}
  let clientId=genId();genOtp=genOtpC();
  temp={client_id:clientId,nama,wa,email,method,created_at:new Date().toISOString()};
  let key=method=='wa'?wa:email.replace(/\./g,'_');
  document.getElementById('msg').innerText='Mengirim OTP...';
  await fetch(`${FB}/otp/${key}.json`,{method:'PUT',body:JSON.stringify({code:genOtp,client_id:clientId,exp:Date.now()+600000,method})});
  await fetch(`${FB}/pending/${clientId}.json`,{method:'PUT',body:JSON.stringify(temp)});
  document.getElementById('formBox').classList.add('hidden');
  document.getElementById('otpBox').classList.remove('hidden');
  document.getElementById('otpTitle').innerText=method=='wa'?'OTP dikirim ke WA':'OTP dikirim ke Email';
  document.getElementById('otpInfo').innerText=method=='wa'?wa:email;
  document.getElementById('otpMsg').innerHTML=`DEMO OTP: <b style="font-size:24px;letter-spacing:4px;color:#fff">${genOtp}</b><br><span class="muted">Nanti auto kirim via WA/Email API</span>`;
}
async function verif(){
  let inp=document.getElementById('otpInput').value.trim();
  if(inp!=genOtp){document.getElementById('otpMsg').innerHTML='<span style="color:#ef4444">❌ OTP salah</span>';return}
  let lic={client_id:temp.client_id,nama:temp.nama,wa:temp.wa,email:temp.email,login_method:method,gas_balance:0,gas_per_day:3,status:"WAITING_PAYMENT",created_at:temp.created_at};
  await fetch(`${FB}/licenses/${lic.client_id}.json`,{method:'PUT',body:JSON.stringify(lic)});
  await fetch(`${FB}/config/${lic.client_id}.json`,{method:'PUT',body:JSON.stringify({lot:1,mode:"single",jarak_tick:20,sl_tick:50,tp_tick:100,pair:"BTCUSDT",status:"PAUSED",api_key:"",api_secret:""})});
  await fetch(`${FB}/live/${lic.client_id}.json`,{method:'PUT',body:JSON.stringify({balance:0,equity:0,profit_today:0,total_profit:0,open_positions:0})});
  document.getElementById('otpBox').classList.add('hidden');
  document.getElementById('doneBox').classList.remove('hidden');
  document.getElementById('myId').innerText=lic.client_id;
  localStorage.setItem('futures_client_id',lic.client_id);
}
</script>
</body>
</html>
