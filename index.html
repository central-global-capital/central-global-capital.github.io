<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Bot Futures - Pilih OTP</title>
<style>
  body{margin:0;background:#080a0f;color:#e5e7eb;font-family:Inter,system-ui,sans-serif;padding:14px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:16px;margin-bottom:12px}
  input{width:100%;padding:13px;background:#020617;border:1px solid #1f2937;color:#fff;border-radius:10px;margin:6px 0;box-sizing:border-box}
  .btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;cursor:pointer}
  .blue{background:#3b82f6;color:#fff}
  .muted{font-size:12px;color:#9ca3af}
  .tabs{display:flex;gap:8px;margin:10px 0}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid #1f2937;background:#020617;color:#9ca3af;text-align:center;font-weight:700;cursor:pointer}
  .tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
  .hidden{display:none}
</style>
</head>
<body>
<div style="max-width:420px;margin:20px auto">
<h2 style="text-align:center;margin:0">🚀 DAFTAR BOT FUTURES</h2>
<p class="muted" style="text-align:center">Pilih metode OTP yang kamu punya</p>

<div class="card" id="formBox">
  <input id="nama" placeholder="Nama Lengkap">
  
  <div class="tabs">
    <div id="tabWa" class="tab active" onclick="setMethod('wa')">📱 No WA</div>
    <div id="tabEmail" class="tab" onclick="setMethod('email')">📧 Email</div>
  </div>

  <div id="inputWa"><input id="wa" placeholder="No WA 62xxxxxx (contoh 62812xxxx)"></div>
  <div id="inputEmail" class="hidden"><input id="email" placeholder="Email kamu (contoh gmail)"></div>

  <input id="apiKey" placeholder="Binance API Key (Futures)">
  <input id="apiSecret" placeholder="Binance Secret Key">
  <div style="background:#020617;padding:8px;border-radius:8px;font-size:11px;margin:6px 0;color:#9ca3af">API: Binance > API Management > Create > Aktifkan Futures Only > Paste disini</div>
  
  <button class="btn blue" onclick="daftar()">DAFTAR & KIRIM OTP</button>
  <div id="msg" class="muted" style="text-align:center;margin-top:8px"></div>
</div>

<div class="card hidden" id="otpBox">
  <div style="text-align:center"><b id="otpTitle">Kode OTP Dikirim</b><br><span class="muted" id="otpInfo"></span></div>
  <input id="otpInput" placeholder="6 digit OTP" maxlength="6" style="text-align:center;font-size:20px;letter-spacing:6px">
  <button class="btn blue" onclick="verifOtp()">VERIFIKASI & AKTIFKAN</button>
  <div id="otpMsg" style="text-align:center;margin-top:10px"></div>
  <button onclick="location.reload()" style="background:transparent;border:0;color:#9ca3af;width:100%;margin-top:10px;font-size:12px">Ganti No WA / Email</button>
</div>

<div class="card hidden" id="doneBox" style="text-align:center">
  <h3>✅ BERHASIL DAFTAR</h3>
  <p class="muted">Tunggu admin approve + isi gas. Kamu akan dapat notif.</p>
  <div style="background:#020617;padding:10px;border-radius:10px;font-size:13px;margin:10px 0">ID KAMU: <b id="myId" style="color:#22c55e"></b><br><span class="muted">Pakai No WA / Email buat login nanti</span></div>
  <a id="dashLink" href="dashboard.html"><button class="btn blue">KE DASHBOARD</button></a>
</div>
</div>

<script>
const FB="https://mrdien-scalper-default-rtdb.firebaseio.com";
let method='wa', tempData={}, genOtp="";

function setMethod(m){
  method=m;
  document.getElementById('tabWa').classList.toggle('active',m==='wa');
  document.getElementById('tabEmail').classList.toggle('active',m==='email');
  document.getElementById('inputWa').classList.toggle('hidden',m!=='wa');
  document.getElementById('inputEmail').classList.toggle('hidden',m!=='email');
}

function genId(){return "CLIENT_"+Math.floor(100+Math.random()*900)}
function genOtpCode(){return Math.floor(100000+Math.random()*900000).toString()}

async function daftar(){
  let nama=document.getElementById('nama').value.trim();
  let wa=document.getElementById('wa').value.trim().replace(/[^0-9]/g,'');
  let email=document.getElementById('email').value.trim();
  let apiKey=document.getElementById('apiKey').value.trim();
  let apiSecret=document.getElementById('apiSecret').value.trim();
  
  if(!nama||!apiKey||!apiSecret){document.getElementById('msg').innerText='Lengkapi nama & API bro';return}
  if(method==='wa' && !wa){document.getElementById('msg').innerText='Isi No WA';return}
  if(method==='email' && !email){document.getElementById('msg').innerText='Isi Email';return}

  document.getElementById('msg').innerText='Membuat akun...';
  let clientId=genId(); genOtp=genOtpCode();
  tempData={client_id:clientId,nama,wa:wa||"",email:email||"",api_key:apiKey,api_secret:apiSecret,otp:genOtp,method,otp_verified:false,status:"PENDING_OTP",created_at:new Date().toISOString()};
  
  let key = method==='wa'? wa : email.replace(/\./g,'_');
  await fetch(`${FB}/pending/${clientId}.json`,{method:'PUT',body:JSON.stringify(tempData)});
  await fetch(`${FB}/otp/${key}.json`,{method:'PUT',body:JSON.stringify({code:genOtp,client_id:clientId,exp:Date.now()+10*60*1000,method})});

  document.getElementById('formBox').classList.add('hidden');
  document.getElementById('otpBox').classList.remove('hidden');
  document.getElementById('otpTitle').innerText=method==='wa'? 'OTP Dikirim ke WA' : 'OTP Dikirim ke Email';
  document.getElementById('otpInfo').innerText=method==='wa'? `WA: ${wa} | ID: ${clientId}` : `Email: ${email} | ID: ${clientId}`;
  // DEMO - tampilkan OTP, nanti ganti API beneran
  document.getElementById('otpMsg').innerHTML=`<div class="muted">DEMO (hapus nanti):</div><div style="font-size:22px;font-weight:800;color:#fff;letter-spacing:4px">${genOtp}</div><div class="muted" style="margin-top:6px">${method==='wa'?'Akan auto kirim via API WA (Fonnte)':'Akan auto kirim via Email (EmailJS)'}</div>`;

  // === DISINI PASANG API ASLI KALO UDAH ADA ===
  // if(method==='wa'){ fetch(`https://api.fonnte.com/send?target=${wa}&message=OTP Bot: ${genOtp}`) }
  // if(method==='email'){ emailjs.send("service_id","template_id",{to_email:email,otp:genOtp}) }
}

async function verifOtp(){
  let inp=document.getElementById('otpInput').value.trim();
  if(inp!==genOtp){document.getElementById('otpMsg').innerHTML='<span style="color:#ef4444">❌ OTP salah, cek lagi</span>';return}
  
  let lic={client_id:tempData.client_id,nama:tempData.nama,wa:tempData.wa,email:tempData.email,api_key:tempData.api_key,api_secret:tempData.api_secret,login_method:method,gas_balance:0,gas_per_day:3,status:"WAITING_PAYMENT",created_at:tempData.created_at};
  await fetch(`${FB}/licenses/${lic.client_id}.json`,{method:'PUT',body:JSON.stringify(lic)});
  await fetch(`${FB}/config/${lic.client_id}.json`,{method:'PUT',body:JSON.stringify({lot:1,mode:"single",jarak_tick:20,sl_tick:50,tp_tick:100,pair:"BTCUSDT",status:"PAUSED"})});
  await fetch(`${FB}/live/${lic.client_id}.json`,{method:'PUT',body:JSON.stringify({balance:0,equity:0,profit_today:0,total_profit:0,open_positions:0})});

  document.getElementById('otpBox').classList.add('hidden');
  document.getElementById('doneBox').classList.remove('hidden');
  document.getElementById('myId').innerText=lic.client_id;
  document.getElementById('dashLink').href=`dashboard.html`;
}
</script>
</body>
</html>
